<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴会仕込み計算</title>
<meta name="description" content="宴会・団体予約の人数とコースから、食材ごとの仕込み量の目安と卸への発注締め切りを計算します。">
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2420; --muted:#7a6d63; --line:#e6ddd1;
  --accent:#a8322d; --accent-ink:#fff; --soft:#f3e7dc; --ok:#2f7a4f; --warn:#b5651d; --late:#a8322d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1715; --card:#252020; --ink:#f1e9e1; --muted:#b3a59a; --line:#3a3230;
    --accent:#e0625b; --accent-ink:#1b1715; --soft:#332a27; --ok:#6cc495; --warn:#e9a25b; --late:#ff7d75;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  line-height:1.6;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
header h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.04em}
header p{margin:0 0 20px;color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:16px}
.card h2{font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:700}
label.lbl{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
input[type=date],input[type=time],input[type=number]{
  width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.people{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.people button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:1.4rem;cursor:pointer}
.people button:active{transform:scale(.96)}
.people .num{flex:1;text-align:center;font-size:2rem;font-weight:700}
.people .num small{font-size:1rem;font-weight:400;color:var(--muted);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem}
.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.courses{grid-template-columns:1fr}}
.course{position:relative}
.course input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.course label{display:block;height:100%;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--bg)}
.course input:checked + label{border-color:var(--accent);background:var(--soft)}
.course input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
.course .name{font-weight:700;font-size:1.1rem}
.course .price{color:var(--accent);font-weight:700;font-size:.9rem}
.course .menu{color:var(--muted);font-size:.8rem;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:1.35rem;font-weight:700;white-space:nowrap}
@media (max-width:520px){.stat .v{font-size:1.05rem}}
.stat .k{font-size:.75rem;color:var(--muted)}
.sup{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sup-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);flex-wrap:wrap}
.sup-head .t{font-weight:700}
.dl{font-size:.88rem;text-align:right}
.dl b{font-size:1rem}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;margin-left:6px;border:1px solid currentColor}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.late{color:var(--late);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.amt{text-align:right;font-weight:700;white-space:nowrap}
td.chkcell{width:40px}
td.chkcell input{width:20px;height:20px;accent-color:var(--accent)}
tr.done td:not(.chkcell){text-decoration:line-through;color:var(--muted)}
.note{font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px;flex:1 1 160px}
.btn.sub{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:12px}
@media print{
  body{background:#fff;color:#000}
  .no-print{display:none!important}
  .card,.sup,.stat{border-color:#999;break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>宴会仕込み計算</h1>
    <p>人数とコースを選ぶと、食材ごとの仕込み量の目安と、卸への発注締め切りが分かります。</p>
  </header>

  <section class="card no-print">
    <h2><span class="step">1</span>宴会の日時と人数</h2>
    <div class="row" style="margin-bottom:14px">
      <div><label class="lbl" for="date">宴会日</label><input type="date" id="date"></div>
      <div><label class="lbl" for="cutoff">卸の発注締め時刻</label><input type="time" id="cutoff" value="15:00"></div>
    </div>
    <label class="lbl" for="peopleRange">人数</label>
    <div class="people">
      <button type="button" id="minus" aria-label="1人減らす">−</button>
      <div class="num"><span id="peopleNum">20</span><small>名</small></div>
      <button type="button" id="plus" aria-label="1人増やす">＋</button>
    </div>
    <input type="range" id="peopleRange" min="4" max="100" value="20" aria-label="人数スライダー">
    <div class="scale"><span>4名</span><span>50名</span><span>100名</span></div>
  </section>

  <section class="card no-print">
    <h2><span class="step">2</span>コースを選ぶ</h2>
    <div class="courses" id="courses"></div>
  </section>

  <section class="card no-print">
    <h2><span class="step">3</span>調整</h2>
    <label class="lbl" for="buffer">予備（ロス・急な増員分）：<b id="bufferVal">10</b>%</label>
    <input type="range" id="buffer" min="0" max="30" step="5" value="10">
    <div class="scale"><span>0%</span><span>15%</span><span>30%</span></div>
    <div class="opts" style="margin-top:12px">
      <label class="chk"><input type="checkbox" id="dessert">デザートを追加する（全員分）</label>
      <label class="chk"><input type="checkbox" id="sunday" checked>卸は日曜休み（締め切りが日曜なら前の土曜に繰り上げ）</label>
    </div>
  </section>

  <div class="summary" id="summary"></div>

  <section class="card">
    <h2>発注先ごとの仕込み量と締め切り</h2>
    <div id="result"></div>
    <p class="note">※ 量は一般的な居酒屋の1人前を基準にした目安です。食材の歩留まり・店の盛り付けに合わせて調整してください。チェックを入れると発注済みとして線が引かれます。</p>
    <div class="actions no-print">
      <button class="btn" id="copy" type="button">発注メモをコピー</button>
      <button class="btn sub" id="print" type="button">印刷する</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 発注先：lead = 宴会日の何日前が締め切りか
const SUPPLIERS = {
  fish:  {name:"鮮魚卸",   lead:2},
  meat:  {name:"精肉卸",   lead:3},
  veg:   {name:"青果卸",   lead:1},
  dry:   {name:"乾物・酒販", lead:4},
};
// 食材：unit = g / 個 / 丁 / 合 / 本、round = 丸め単位
const ITEMS = {
  sashimi:{name:"刺身用鮮魚（マグロ・サーモン等）", sup:"fish", unit:"g", round:50},
  shell:  {name:"貝類・甲殻類",                 sup:"fish", unit:"g", round:50},
  chicken:{name:"鶏もも肉",                     sup:"meat", unit:"g", round:100},
  pork:   {name:"豚バラ薄切り",                 sup:"meat", unit:"g", round:100},
  beef:   {name:"牛肩ロース",                   sup:"meat", unit:"g", round:100},
  leaf:   {name:"葉物野菜（キャベツ・レタス等）",  sup:"veg",  unit:"g", round:100},
  root:   {name:"根菜・きのこ",                 sup:"veg",  unit:"g", round:100},
  tofu:   {name:"豆腐",                         sup:"veg",  unit:"丁", round:1},
  egg:    {name:"卵",                           sup:"veg",  unit:"個", round:1},
  rice:   {name:"米",                           sup:"dry",  unit:"合", round:1},
  noodle: {name:"中華麺・うどん",               sup:"dry",  unit:"玉", round:1},
  soup:   {name:"鍋つゆ・出汁",                 sup:"dry",  unit:"ml", round:100},
  dessert:{name:"デザート（アイス・シャーベット）", sup:"dry", unit:"個", round:1},
};
// 1人あたりの量
const COURSES = [
  {id:"ume", name:"梅", price:"3,500円", menu:"お造り二種・唐揚げ・サラダ・焼きそば",
   per:{sashimi:40, chicken:120, leaf:80, root:30, noodle:0.5, egg:0.5}},
  {id:"take",name:"竹", price:"5,000円", menu:"お造り三種・サラダ・豚しゃぶ鍋・雑炊",
   per:{sashimi:60, pork:120, leaf:120, root:80, tofu:0.25, soup:250, rice:0.3, egg:0.5}},
  {id:"matsu",name:"松",price:"7,000円", menu:"お造り五種・海鮮焼き・牛ステーキ・季節の鍋・ご飯",
   per:{sashimi:90, shell:60, beef:120, chicken:60, leaf:120, root:100, tofu:0.25, soup:250, rice:0.5}},
];

const $ = id => document.getElementById(id);
const state = {people:20, course:"take"};

// 初期日付：1週間後
const d0 = new Date(); d0.setDate(d0.getDate()+7);
$("date").value = toISO(d0);

function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const WD = ["日","月","火","水","木","金","土"];
function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`}

// コースカード
$("courses").innerHTML = COURSES.map(c=>`
  <div class="course">
    <input type="radio" name="course" id="c-${c.id}" value="${c.id}" ${c.id===state.course?"checked":""}>
    <label for="c-${c.id}"><div class="name">${c.name}コース</div><div class="price">${c.price}</div><div class="menu">${c.menu}</div></label>
  </div>`).join("");
document.querySelectorAll('input[name=course]').forEach(r=>r.addEventListener("change",e=>{state.course=e.target.value;render()}));

function setPeople(n){
  state.people = Math.max(1, Math.min(200, n));
  $("peopleNum").textContent = state.people;
  $("peopleRange").value = Math.min(100, state.people);
  render();
}
$("minus").onclick = ()=>setPeople(state.people-1);
$("plus").onclick  = ()=>setPeople(state.people+1);
$("peopleRange").oninput = e=>setPeople(+e.target.value);
["date","cutoff","dessert","sunday"].forEach(id=>$(id).addEventListener("input",render));
$("buffer").oninput = ()=>{ $("bufferVal").textContent=$("buffer").value; render(); };

function fmtAmt(v,item){
  const r = Math.ceil(v/item.round)*item.round;
  if(item.unit==="g" && r>=1000) return (r/1000).toFixed(r%1000===0?0:1)+" kg";
  if(item.unit==="ml" && r>=1000) return (r/1000).toFixed(r%1000===0?0:1)+" L";
  return r.toLocaleString()+" "+item.unit;
}

function deadlineFor(sup){
  const [y,m,d] = $("date").value.split("-").map(Number);
  if(!y) return null;
  const dt = new Date(y,m-1,d);
  dt.setDate(dt.getDate()-SUPPLIERS[sup].lead);
  if($("sunday").checked && dt.getDay()===0) dt.setDate(dt.getDate()-1);
  const [hh,mm] = ($("cutoff").value||"15:00").split(":").map(Number);
  dt.setHours(hh,mm,0,0);
  return dt;
}
function remain(dt){
  const ms = dt - new Date();
  if(ms<0) return {cls:"late",txt:"締め切り超過"};
  const h = Math.floor(ms/3600000);
  if(h<24) return {cls:"warn",txt:`あと${h}時間`};
  return {cls:"ok",txt:`あと${Math.floor(h/24)}日`};
}

let lastList = [];
const doneSet = new Set();

function compute(){
  const c = COURSES.find(x=>x.id===state.course);
  const per = {...c.per};
  if($("dessert").checked) per.dessert = 1;
  const mult = state.people * (1 + $("buffer").value/100);
  const groups = {};
  for(const [k,v] of Object.entries(per)){
    const it = ITEMS[k];
    (groups[it.sup] ||= []).push({key:k, item:it, amt:fmtAmt(v*mult,it)});
  }
  return {c, groups};
}

function render(){
  const {c, groups} = compute();
  const sups = Object.keys(SUPPLIERS).filter(s=>groups[s])
    .map(s=>({s, dl:deadlineFor(s)}))
    .sort((a,b)=>(a.dl||0)-(b.dl||0));
  const first = sups[0]?.dl;
  const prep = state.people * (1 + $("buffer").value/100);
  $("summary").innerHTML = `
    <div class="stat"><div class="v">${state.people}名</div><div class="k">${c.name}コース</div></div>
    <div class="stat"><div class="v">${Math.ceil(prep)}人前</div><div class="k">予備込みの仕込み</div></div>
    <div class="stat"><div class="v">${first?fmtDate(first):"—"}</div><div class="k">最初の発注締め</div></div>`;

  if(!first){ $("result").innerHTML = `<p class="empty">宴会日を入力してください。</p>`; lastList=[]; return; }

  lastList = sups.map(({s,dl})=>({sup:SUPPLIERS[s], dl, rows:groups[s]}));
  $("result").innerHTML = lastList.map(g=>{
    const r = remain(g.dl);
    return `<div class="sup">
      <div class="sup-head">
        <span class="t">${g.sup.name}</span>
        <span class="dl">締め切り <b>${fmtDate(g.dl)} ${$("cutoff").value}</b><span class="badge ${r.cls}">${r.txt}</span></span>
      </div>
      <table><tbody>${g.rows.map(x=>`
        <tr class="${doneSet.has(x.key)?"done":""}">
          <td class="chkcell"><input type="checkbox" data-k="${x.key}" ${doneSet.has(x.key)?"checked":""} aria-label="${x.item.name}を発注済みにする"></td>
          <td>${x.item.name}</td><td class="amt">${x.amt}</td>
        </tr>`).join("")}</tbody></table>
    </div>`;
  }).join("") + (lastList.some(g=>remain(g.dl).cls==="late")
     ? `<p class="note" style="color:var(--late)">⚠ 締め切りを過ぎた発注先があります。卸に電話で間に合うか確認しましょう。</p>` : "");

  $("result").querySelectorAll("input[data-k]").forEach(cb=>cb.addEventListener("change",e=>{
    const k=e.target.dataset.k; e.target.checked?doneSet.add(k):doneSet.delete(k);
    e.target.closest("tr").classList.toggle("done",e.target.checked);
  }));
}

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

$("copy").onclick = async ()=>{
  const c = COURSES.find(x=>x.id===state.course);
  const [y,m,d] = $("date").value.split("-").map(Number);
  let txt = `【宴会発注メモ】${y?fmtDate(new Date(y,m-1,d)):""} ${c.name}コース ${state.people}名（予備${$("buffer").value}%込み）\n`;
  for(const g of lastList){
    txt += `\n■ ${g.sup.name}（締め切り ${fmtDate(g.dl)} ${$("cutoff").value}）\n`;
    for(const x of g.rows) txt += `・${x.item.name}　${x.amt}\n`;
  }
  try{ await navigator.clipboard.writeText(txt); toast("発注メモをコピーしました"); }
  catch{
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); toast("発注メモをコピーしました");}catch{toast("コピーできませんでした");}
    ta.remove();
  }
};
$("print").onclick = ()=>window.print();

render();
</script>
</body>
</html>
